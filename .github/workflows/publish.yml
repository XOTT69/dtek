name: DTEK schedules to Telegram

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/publish.yml'
  schedule:
    # GitHub-only polling, best effort: delayed or skipped runs are possible.
    # No timed Telegram outage reminders are emitted by the bot.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dtek-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CHANNEL_USERNAME: ${{ vars.TELEGRAM_CHANNEL_USERNAME }}
      SOURCE_MODE: ${{ vars.SOURCE_MODE }}
      UKRENERGO_NOTICES: ${{ vars.UKRENERGO_NOTICES }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show scheduler event diagnostics
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "Start UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Commit: ${{ github.sha }}"
      - name: Validate schedule conversion
        run: npm test
      - name: Publish updated schedules
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: node src/bot.mjs
      - name: Persist published state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f state/publications.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A create-only reservation can advance main while the bot works.
          # Do a 3-way JSON state merge, never rebase two conflicting state files.
          local_state="$(mktemp)"
          base_state="$(mktemp)"
          cp state/publications.json "$local_state"
          git show HEAD:state/publications.json > "$base_state" || printf '%s\n' '{"publications":{}}' > "$base_state"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node src/merge-state.mjs "$base_state" "$local_state" state/publications.json
            git add state/publications.json
            if git diff --cached --quiet; then
              echo 'Latest state already persisted.'
              exit 0
            fi
            git commit -m 'chore: remember Telegram publications [skip ci]'
            if git push origin HEAD:main; then
              echo 'Publication state safely saved.'
              exit 0
            fi
            sleep 2
          done
          echo 'Failed to persist merged Telegram state after retries' >&2
          exit 1
