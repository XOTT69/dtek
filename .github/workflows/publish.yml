name: DTEK schedules to Telegram

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/publish.yml'
  schedule:
    # Shift the minute offset to refresh/re-register the scheduled event.
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dtek-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CHANNEL_USERNAME: ${{ vars.TELEGRAM_CHANNEL_USERNAME }}
      SOURCE_MODE: ${{ vars.SOURCE_MODE }}
      UKRENERGO_NOTICES: ${{ vars.UKRENERGO_NOTICES }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate schedule conversion
        run: npm test
      - name: Publish updated schedules
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: node src/bot.mjs
      - name: Persist published state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f state/publications.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/publications.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: remember Telegram publications [skip ci]'
          # Main can advance while the bot is fetching schedules.
          # Retry safe fast-forward via rebase; never force-push publication state.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo 'Failed to persist Telegram publication state after retries' >&2
          exit 1
